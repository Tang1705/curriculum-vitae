<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>

<body>
<div id="page-container">

      <div class="section-header"><h2>E<span>du</span><span style="color:black">cation</span></h2><div class="divider"></div></div>

      <div class="section-header"><h2>S<span>ki</span><span style="color:black">lls</span></h2><div class="divider"></div></div>
      <div id="skills-content"></div>
    </div>

    <div id="footer" style="display: none;"></div>
  </div>
